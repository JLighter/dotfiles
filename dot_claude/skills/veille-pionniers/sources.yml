# Pionniers du développement logiciel : celles et ceux dont les livres ou les
# pratiques sont devenus des références (pas les voix IA du moment).
#
# Deux types de sources :
#   - feed:   flux RSS/Atom lu par fetch_feeds.py
#   - search: requête WebSearch lancée par le skill (auteur sans flux, ou flux dormant)
# Une source peut avoir les deux (flux dormant + présence ailleurs).
# Flux vérifiés le 23/09/2026.

sources:
