# Installé par ./init.sh (pre-commit install --install-hooks et --hook-type commit-msg).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: commit-msg-id
        name: identifiant de traçabilité dans le message
        # Merge, revert, fixup! et squash! sont exemptés : leur message est généré par git.
        entry: bash -c 'head -1 "$1" | grep -qE "^(Merge|Revert|fixup!|squash!) " && exit 0; grep -qE "(^|[^A-Za-z])(US|BR|ADR|HI|F)-[0-9]+" "$1" || { echo "Message sans identifiant (US-, BR-, ADR-, HI-, F-)"; exit 1; }' --
        language: system
        stages: [commit-msg]
