<title>__TITLE__</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f2f4f6; --surface: #ffffff; --ink: #172029; --ink-2: #4a5866; --line: #d4dbe2;
    --accent: #0f6e68; --accent-ink: #ffffff; --accent-soft: #dcefec;
    --signal: #b8641c; --signal-soft: #f8e9d8;
    --bad: #a8323a; --bad-soft: #f7e1e2;
    --mono-bg: #e9edf0;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
    --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #11171d; --surface: #182028; --ink: #e6ebef; --ink-2: #a3b0bc; --line: #2c3742;
      --accent: #4fc3b8; --accent-ink: #0b1a18; --accent-soft: #163a37;
      --signal: #e8a15a; --signal-soft: #3a2a17;
      --bad: #f08a90; --bad-soft: #3d1f22;
      --mono-bg: #202a34;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #11171d; --surface: #182028; --ink: #e6ebef; --ink-2: #a3b0bc; --line: #2c3742;
    --accent: #4fc3b8; --accent-ink: #0b1a18; --accent-soft: #163a37;
    --signal: #e8a15a; --signal-soft: #3a2a17;
    --bad: #f08a90; --bad-soft: #3d1f22;
    --mono-bg: #202a34;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; margin: 0; padding-inline: 16px; padding-block: 0 64px; }
  .wrap { max-width: 820px; margin: 0 auto; display: grid; gap: 24px; }
  header { padding-block: 40px 8px; display: grid; gap: 10px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.02; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
  .lede { color: var(--ink-2); max-width: 60ch; margin: 0; }
  .rule { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
  .rule span { font-family: var(--mono); font-size: 12px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: var(--ink-2); }
  .rule b { color: var(--accent); font-weight: 500; }

  .progress { display: flex; gap: 4px; }
  .progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .progress i.ok { background: var(--accent); }
  .progress i.ko { background: var(--bad); }
  .progress i.cur { outline: 2px solid var(--ink-2); outline-offset: 1px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 16px; }
  .meta { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .src { font-family: var(--mono); font-size: 12px; padding: 3px 9px; border-radius: 4px; background: var(--mono-bg); }
  .q { font-family: var(--display); font-weight: 500; font-size: 1.25rem; margin: 0; line-height: 1.25; }
  pre { margin: 0; font-family: var(--mono); font-size: 13.5px; line-height: 1.5; background: var(--mono-bg); border-radius: 8px; padding: 14px 16px; overflow-x: auto; white-space: pre; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
  .opts button { font: inherit; text-align: left; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: baseline; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
  .opts button .n { font-family: var(--mono); color: var(--ink-2); font-size: 13px; }
  .opts button:hover:not(:disabled) { border-color: var(--accent); }
  .opts button:disabled { cursor: default; opacity: .75; }
  .opts button.pick { border-color: var(--ink); }
  .opts button.good { border-color: var(--accent); background: var(--accent-soft); opacity: 1; }
  .opts button.wrong { border-color: var(--bad); background: var(--bad-soft); opacity: 1; }

  .fb { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; display: grid; gap: 6px; }
  .fb.ko { border-color: var(--bad); background: var(--bad-soft); }
  .fb.trap { border-color: var(--signal); background: var(--signal-soft); }
  .fb .t { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .fb.ko .t { color: var(--bad); } .fb.trap .t { color: var(--signal); } .fb:not(.ko):not(.trap) .t { color: var(--accent); }
  .fb p { margin: 0; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .score { display: grid; gap: 16px; }
  .big { font-family: var(--display); font-size: clamp(2.4rem, 8vw, 4rem); font-weight: 700; line-height: 1; letter-spacing: -.02em; }
  .big small { font-size: .4em; color: var(--ink-2); font-weight: 500; }
  .diag { display: grid; gap: 8px; }
  .diag div { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
  .diag div:last-child { border-bottom: 0; }
  .diag .k { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .verdict { padding: 14px 16px; border-radius: 8px; background: var(--signal-soft); border-left: 3px solid var(--signal); }
  .verdict p { margin: 0; }
  @media (prefers-reduced-motion: no-preference) { .card { transition: opacity .15s; } }
  /* Libellé au-dessus de sa description : la colonne de 26 px ne sert qu'aux numéros du quiz 1. */
  .opts button { grid-template-columns: 1fr; gap: 2px; }
  .opts button .n { font-family: var(--body); color: var(--ink); font-weight: 600; font-size: 0.95rem; }
  .opts button > span:last-child { color: var(--ink-2); font-size: 0.9rem; }
  /* Une colonne de grille ne doit jamais s'élargir à la taille d'un bloc de code : seul le bloc défile. */
  .wrap { grid-template-columns: minmax(0, 1fr); }
  .wrap > *, .card > *, .score > * { min-width: 0; }
  pre { max-width: 100%; }
</style>
