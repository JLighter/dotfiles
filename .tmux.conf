# ══════════════════════════════════
# Terminal & Shell
# ══════════════════════════════════
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -ga terminal-overrides ",${TERM}:Tc"
# Undercurl support (Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Claude Code dans tmux (cf. code.claude.com/docs/fr/terminal-config) :
# - allow-passthrough laisse passer les notifications de bureau et la barre de
#   progression jusqu'au terminal hôte (Ghostty), au lieu d'être avalées par tmux.
# - extkeys (avec extended-keys on, défini plus bas) fiabilise Maj+Entrée pour
#   insérer un saut de ligne au lieu de soumettre.
set -g allow-passthrough on
set -as terminal-features 'xterm*:extkeys'

# ══════════════════════════════════
# General Settings
# ══════════════════════════════════
set -g prefix C-space
bind C-a send-prefix
unbind C-b

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g extended-keys on
set -g set-clipboard on

# ══════════════════════════════════
# Windows & Panes
# ══════════════════════════════════
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ══════════════════════════════════
# Keybindings
# ══════════════════════════════════
bind r source-file ~/.tmux.conf \; display "tmux reloaded"
bind / split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind C-i new-window "nvim #{pane_current_path}"

# ── Arbre sessions/fenêtres (choose-tree) personnalisé ────────────────────
# Surcharge les binds par défaut prefix+s / prefix+w :
#   -O time : tri par activité (les plus récentes en haut)
#   -N -N   : preview agrandie du pane survolé
#   -Z      : ouvre zoomé (plein écran)
#   -F      : format de ligne aux couleurs Catppuccin, avec le glyph d'état
#             Claude recoloré (✳ vert = prêt, Braille pêche = en travail),
#             cohérent avec l'indicateur de la status bar.
%hidden TREE_FORMAT="#{?#{m:✳*,#{pane_title}},#[fg=#{@thm_green}]#{pane_title}#[default],#{?#{m:[⠀-⣿]*,#{pane_title}},#[fg=#{@thm_peach}]#{pane_title}#[default],#{window_name}}}"
bind s choose-tree -Zs -O time -N -N -F "$TREE_FORMAT"
bind w choose-tree -Zw -O time -N -N -F "$TREE_FORMAT"
# (la couleur de la ligne sélectionnée — mode-style — est posée après le
#  chargement de Catppuccin, plus bas, sinon le plugin la réécrit.)
# ──────────────────────────────────────────────────────────────────────────

# Vi mode
setw -g mode-keys vi
set -g status-keys vi
bind k copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi 'C-r' send-keys -X rectangle-toggle
if-shell "uname | grep -q Darwin" 'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'

# ══════════════════════════════════
# Quiet
# ══════════════════════════════════
setw -g monitor-activity off
set -g monitor-silence 0
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# ══════════════════════════════════
# Plugins
# ══════════════════════════════════
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-yank'

# Plugin settings
set -g @yank_with_mouse on
set -g @shell_mode 'vi'

# ══════════════════════════════════
# Theme (Catppuccin)
# ══════════════════════════════════
# Flavor initial (dark). Au démarrage, le terminal (Ghostty) signale son thème
# courant via OSC : si le système est en clair, le hook client-light-theme
# ci-dessous corrige immédiatement vers latte.
set -g @catppuccin_flavor 'macchiato'

# Auto-switch clair/sombre piloté par le terminal (tmux 3.6+).
# Ghostty (window-theme = auto) envoie l'événement de thème quand macOS bascule ;
# tmux déclenche alors le hook correspondant. Le rechargement passe par
# reload-theme.sh, qui purge les @thm_* en cache (palette en `set -ogq`) avant
# de recharger Catppuccin — sinon les couleurs du flavor précédent persistent.
set-hook -g client-dark-theme  'run-shell "~/.config/tmux/reload-theme.sh macchiato"'
set-hook -g client-light-theme 'run-shell "~/.config/tmux/reload-theme.sh latte"'

# Menu styling
set -g @catppuccin_menu_selected_style "fg=#{@thm_fg},bold,bg=#{@thm_overlay_0}"

# Pane styling
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "##{?pane_in_mode,fg=#{@thm_lavender},##{?pane_synchronized,fg=#{@thm_mauve},fg=#{@thm_lavender}}}"
set -g @catppuccin_pane_left_separator "█"
set -g @catppuccin_pane_middle_separator "█"
set -g @catppuccin_pane_right_separator "█"
set -g @catppuccin_pane_color "#{@thm_green}"
set -g @catppuccin_pane_background_color "#{@thm_surface_0}"
set -g @catppuccin_pane_default_text "##{b:pane_current_path}"
set -g @catppuccin_pane_default_fill "number"
set -g @catppuccin_pane_number_position "left"

# Window styling
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text_color "#{@thm_surface_0}"
set -g @catppuccin_window_number_color "#{@thm_overlay_2}"
# ── Indicateur d'état Claude ──────────────────────────────────────────────
# Le titre du pane porte un glyph d'état Claude en tête : ✳ = prêt, un caractère
# Braille (U+2800..U+28FF) = spinner « en travail ». On recolore ce glyph via un
# format conditionnel 100 % tmux (#{m:} = fnmatch), sans script ni fork de shell :
#   - titre commençant par ✳        → glyph vert (@thm_green)  = prêt
#   - titre commençant par un Braille → glyph pêche (@thm_peach) = en travail
#   - sinon                          → titre brut, aucune recoloration
# #{m:} matche par préfixe ; #[default] restaure la couleur normale pour le titre.
set -g @catppuccin_window_text " #{?#{m:✳*,#T},#[fg=#{@thm_green}]#T #[default],#{?#{m:[⠀-⣿]*,#T},#[fg=#{@thm_peach}]#T #[default],#T }}"
# ──────────────────────────────────────────────────────────────────────────
set -g @catppuccin_window_number "#I"
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_mauve}"
# ── Indicateur d'état Claude (fenêtre courante) ───────────────────────────
set -g @catppuccin_window_current_text " #{?#{m:✳*,#T},#[fg=#{@thm_green}]#T #[default],#{?#{m:[⠀-⣿]*,#T},#[fg=#{@thm_peach}]#T #[default],#T }}"
# ──────────────────────────────────────────────────────────────────────────
set -g @catppuccin_window_current_number "#I"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_flags "none"
set -g @catppuccin_window_flags_icon_last " 󰖰"
set -g @catppuccin_window_flags_icon_current " 󰖯"
set -g @catppuccin_window_flags_icon_zoom " 󰁌"
set -g @catppuccin_window_flags_icon_mark " 󰃀"
set -g @catppuccin_window_flags_icon_silent " 󰂛"
set -g @catppuccin_window_flags_icon_activity " 󱅫"
set -g @catppuccin_window_flags_icon_bell " 󰂞"
set -g @catppuccin_window_flags_icon_format "##{?window_activity_flag,#{E:@catppuccin_window_flags_icon_activity},}##{?window_bell_flag,#{E:@catppuccin_window_flags_icon_bell},}##{?window_silence_flag,#{E:@catppuccin_window_flags_icon_silent},}##{?window_active,#{E:@catppuccin_window_flags_icon_current},}##{?window_last_flag,#{E:@catppuccin_window_flags_icon_last},}##{?window_marked_flag,#{E:@catppuccin_window_flags_icon_mark},}##{?window_zoomed_flag,#{E:@catppuccin_window_flags_icon_zoom},} "

# Status line styling
set -g @catppuccin_status_left_separator "█"
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "yes"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_module_bg_color "#{@thm_surface_0}"

# ══════════════════════════════════
# Status Bar
# ══════════════════════════════════
set -g status-interval 2
set -g status-justify left
set -g status-position top
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -ag status-right "#{E:@catppuccin_status_session}"
# set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Reset catppuccin current-window separator cache (stale values block v2.1.3 fix)
set -gu @catppuccin_window_current_left_separator
set -gu @catppuccin_window_current_middle_separator
set -gu @catppuccin_window_current_right_separator

# Load catppuccin (manual load — not via TPM)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Couleur de la ligne sélectionnée dans choose-tree / copy-mode, accordée au
# thème. Posé APRÈS Catppuccin, qui réécrit mode-style à son chargement.
set -g mode-style "fg=#{@thm_fg},bg=#{@thm_surface_1},bold"

# Remplace les marqueurs de débordement de la liste de fenêtres (< >) par des
# flèches Nerd Font. Matérialise le status-format par défaut (laissé interne par
# tmux et Catppuccin) et y pose les flèches. Après chargement de Catppuccin.
run-shell "~/.config/tmux/fix-status-markers.sh"

# Initialize TPM (must be last)
run -b '~/.tmux/plugins/tpm/tpm'
