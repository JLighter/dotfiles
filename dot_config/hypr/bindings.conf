# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Logitech MX Keys
# bind = SUPER SHIFT, S, exec, omarchy-capture-screenshot      # Print Screen Button
# bind = SUPER, H, exec, voxtype record toggle                 # Dictation Button
# bind = SUPER, PERIOD, exec, omarchy-launch-walker -m symbols # Emoji Button

# ══════════════════════════════════════════════════════════════════════════════
# Couche i3 — modificateur ALT
# ══════════════════════════════════════════════════════════════════════════════
# Reprise des raccourcis i3, où $mod valait Mod1 (ALT). hyprland.conf source les
# défauts Omarchy avant ce fichier : chaque geste repris est donc d'abord unbind
# sur SUPER, pour qu'il n'y ait qu'une seule façon de le faire.
#
# ATTENTION : ALT+lettre est aussi l'accès aux menus des applications GTK/Qt
# (ALT+F fichier, ALT+E édition…). Ces combinaisons ne leur parviendront plus.
# C'était déjà le cas sous i3.
#
# ALT+TAB / ALT+SHIFT+TAB restent aux défauts Omarchy (cycle des fenêtres).
#
# Sans équivalent en dwindle, donc non repris : layout stacking (mod+s),
# layout tabbed (mod+w), focus parent (mod+a), split h/v explicite (mod+h,
# mod+v — c'est togglesplit sur ALT+E qui s'en rapproche le plus), et le
# bascule focus flottant/tuilé (mod+space).

# ── Terminal et lanceur ──
unbind = SUPER, RETURN
unbind = SUPER, SPACE
bindd = ALT, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = ALT, D, Launch apps, exec, omarchy-launch-walker

# ── Fermer la fenêtre (i3 : mod+Shift+A) ──
unbind = SUPER, W
bindd = ALT SHIFT, A, Close window, killactive,

# ── Focus : j/k/l/; comme en i3, décalé d'un cran par rapport à hjkl ──
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
bindd = ALT, J, Focus on left window, movefocus, l
bindd = ALT, K, Focus on below window, movefocus, d
bindd = ALT, L, Focus on above window, movefocus, u
bindd = ALT, SEMICOLON, Focus on right window, movefocus, r
bindd = ALT, LEFT, Focus on left window, movefocus, l
bindd = ALT, DOWN, Focus on below window, movefocus, d
bindd = ALT, UP, Focus on above window, movefocus, u
bindd = ALT, RIGHT, Focus on right window, movefocus, r

# ── Déplacer la fenêtre ──
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
bindd = ALT SHIFT, J, Move window left, movewindow, l
bindd = ALT SHIFT, K, Move window down, movewindow, d
bindd = ALT SHIFT, L, Move window up, movewindow, u
bindd = ALT SHIFT, SEMICOLON, Move window right, movewindow, r
bindd = ALT SHIFT, LEFT, Move window left, movewindow, l
bindd = ALT SHIFT, DOWN, Move window down, movewindow, d
bindd = ALT SHIFT, UP, Move window up, movewindow, u
bindd = ALT SHIFT, RIGHT, Move window right, movewindow, r

# ── Disposition ──
unbind = SUPER, F
unbind = SUPER, J
unbind = SUPER, T
bindd = ALT, F, Full screen, fullscreen, 0
bindd = ALT, E, Toggle window split, layoutmsg, togglesplit
bindd = ALT SHIFT, SPACE, Toggle window floating/tiling, togglefloating,

# ── Workspaces (i3 : mod+1..0) ──
# Omarchy bind ces touches par keycode, pas par chiffre : code:10 = 1 … code:19 = 0.
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
bindd = ALT, code:10, Switch to workspace 1, workspace, 1
bindd = ALT, code:11, Switch to workspace 2, workspace, 2
bindd = ALT, code:12, Switch to workspace 3, workspace, 3
bindd = ALT, code:13, Switch to workspace 4, workspace, 4
bindd = ALT, code:14, Switch to workspace 5, workspace, 5
bindd = ALT, code:15, Switch to workspace 6, workspace, 6
bindd = ALT, code:16, Switch to workspace 7, workspace, 7
bindd = ALT, code:17, Switch to workspace 8, workspace, 8
bindd = ALT, code:18, Switch to workspace 9, workspace, 9
bindd = ALT, code:19, Switch to workspace 10, workspace, 10

# ── Déplacer la fenêtre vers un workspace (i3 : mod+Shift+1..0) ──
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
bindd = ALT SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = ALT SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = ALT SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = ALT SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = ALT SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = ALT SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = ALT SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = ALT SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = ALT SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
bindd = ALT SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10

# ── Session (i3 : mod+Shift+C recharge, mod+Shift+E quitte) ──
bindd = ALT SHIFT, C, Reload Hyprland config, exec, hyprctl reload
bindd = ALT SHIFT, E, Exit Hyprland, exec, omarchy-menu system
