# Workspaces indépendants par écran — NON ACTIF, rien ici n'est chargé.
#
# État au 07/08/2026 : hyprsplit ne compile pas sur Hyprland 0.56.0. L'issue
# upstream est ouverte (déplacement de helpers/Monitor.hpp, refactor
# CCompositor → state/*, CWorkspaceRule devenu CSharedPointer) et le dépôt
# n'a plus reçu de commit depuis le 11/06/2026. Ses commit_pins hyprpm
# s'arrêtent à Hyprland 0.54.3. Il n'existe pas non plus de paquet AUR.
#
# Alternative compatible 0.56.x et activement maintenue :
# https://github.com/zjeffer/split-monitor-workspaces
# Même fonctionnalité, mais les noms changent : dispatchers `split-workspace`
# et `split-movetoworkspace` (tirets, pas deux-points), et l'option de comptage
# s'appelle `count` au lieu de `num_workspaces`.
#
# ── Pour activer ─────────────────────────────────────────────────────────────
#
#   1. Installer le plugin :
#        hyprpm update
#        hyprpm add https://github.com/shezdy/hyprsplit
#        hyprpm enable hyprsplit
#        hyprpm reload
#
#   2. Décommenter tout ce qui suit.
#
#   3. Ajouter dans ~/.config/hypr/hyprland.conf :
#        source = ~/.config/hypr/hyprsplit.conf
#        exec-once = hyprpm reload -n
#
# Ne pas ajouter de ligne `plugin = /usr/lib/libhyprsplit.so` : c'est hyprpm
# qui charge le .so qu'il a compilé dans ~/.local/share/hyprpm, et ce chemin
# /usr/lib ne correspond à aucun paquet existant.

# 5 workspaces par écran. Avec deux écrans, le premier reçoit les workspaces
# 1 à 5 et le second les 6 à 10, tous deux adressés par SUPER + 1..5 selon
# l'écran qui a le focus.
# plugin {
#     hyprsplit {
#         num_workspaces = 5
#     }
# }

# Omarchy bind SUPER + [1-0] par keycodes (code:10 à code:19), pas par
# chiffres. Un `bind = SUPER, 1, ...` ne remplacerait donc rien : il faut
# unbind sur les mêmes keycodes avant de reposer les siens.
#
# Ce qui suit ne couvre que 1..5. SUPER + 6..0 restent sur les bindings
# d'Omarchy et continuent de viser les workspaces globaux 6 à 10 — soit,
# avec deux écrans, ceux du second. Décommenter aussi les unbind code:15
# à code:19 plus bas pour supprimer cette ambiguïté.

# unbind = SUPER, code:10
# unbind = SUPER, code:11
# unbind = SUPER, code:12
# unbind = SUPER, code:13
# unbind = SUPER, code:14
# bind = SUPER, code:10, split:workspace, 1
# bind = SUPER, code:11, split:workspace, 2
# bind = SUPER, code:12, split:workspace, 3
# bind = SUPER, code:13, split:workspace, 4
# bind = SUPER, code:14, split:workspace, 5

# unbind = SUPER SHIFT, code:10
# unbind = SUPER SHIFT, code:11
# unbind = SUPER SHIFT, code:12
# unbind = SUPER SHIFT, code:13
# unbind = SUPER SHIFT, code:14
# bind = SUPER SHIFT, code:10, split:movetoworkspace, 1
# bind = SUPER SHIFT, code:11, split:movetoworkspace, 2
# bind = SUPER SHIFT, code:12, split:movetoworkspace, 3
# bind = SUPER SHIFT, code:13, split:movetoworkspace, 4
# bind = SUPER SHIFT, code:14, split:movetoworkspace, 5

# Neutraliser SUPER + 6..0, sans équivalent avec 5 workspaces par écran.
# unbind = SUPER, code:15
# unbind = SUPER, code:16
# unbind = SUPER, code:17
# unbind = SUPER, code:18
# unbind = SUPER, code:19
